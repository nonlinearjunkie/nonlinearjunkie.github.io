<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">Five-frame overlap for long motion generation</title><desc id="desc">The next scene query follows generated motion. Overlapping windows extend the sequence without future reference poses.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#91a3af" stroke-width="1.2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><text x="26" y="30" font-size="15" fill="#355f86" font-weight="600" text-anchor="start">CHAIN LOCAL MOTION WINDOWS</text><rect x="26" y="64" width="1068" height="75" rx="13" fill="#f2f0e9" stroke="#c2cdd4"/><text x="47" y="99" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Same static map · query at the start of each motion window</text><polyline points="196,139 196,192" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="560,139 560,192" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="924,139 924,192" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="26" y="200" width="333" height="133" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="47" y="235" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Generate first window</text><text x="47" y="267" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Starting scene query</text><text x="47" y="294" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Up to 300 frames at 30 Hz</text><polyline points="359,266 389,266" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="393" y="200" width="333" height="133" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="414" y="235" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Generate next window</text><text x="414" y="267" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Keep the last 5 frames</text><text x="414" y="294" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">as starting constraints</text><polyline points="726,266 756,266" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="760" y="200" width="334" height="133" rx="13" fill="#edf3ef" stroke="#c2cdd4"/><text x="781" y="235" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Blend and append</text><text x="781" y="267" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Blend the 5-frame overlap</text><text x="781" y="294" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Append only the new suffix</text><polyline points="925,333 925,383 560,383 560,333" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="741" y="375" font-size="16" fill="#5c6b73" font-weight="400" text-anchor="middle">Repeat for the requested duration</text><text x="560" y="437" font-size="19" fill="#20303b" font-weight="400" text-anchor="middle">Restore terrain height + scene coordinates → export the G1 kinematic trajectory</text></g></svg>