<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">LiDAR geometry becomes scene tokens</title><desc id="desc">Two scene representations form the 156 tokens supplied to both motion denoisers.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#91a3af" stroke-width="1.2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><text x="26" y="30" font-size="15" fill="#355f86" font-weight="600" text-anchor="start">SCENE ENCODING</text><rect x="26" y="160" width="235" height="173" rx="13" fill="#f2f0e9" stroke="#c2cdd4"/><text x="47" y="195" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Prebuilt LiDAR map</text><text x="47" y="227" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Planes + distance field</text><text x="47" y="254" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Query at window start</text><polyline points="261,201 283,201 283,135 311,135" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="261,290 283,290 283,337 311,337" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="311" y="61" width="421" height="155" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="332" y="96" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Finite geometry</text><text x="332" y="128" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Faces · boundaries · body probes</text><text x="332" y="155" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Packet encoder → 64 tokens</text><rect x="311" y="263" width="421" height="155" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="332" y="298" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Elevation grid</text><text x="332" y="330" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">88 spatial + 4 summary tokens</text><rect x="333" y="355" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="344" y="355" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="355" y="355" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="366" y="355" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="377" y="355" width="9" height="9" rx="2" fill="#93afbd"/><rect x="388" y="355" width="9" height="9" rx="2" fill="#93afbd"/><rect x="399" y="355" width="9" height="9" rx="2" fill="#5f879e"/><rect x="333" y="366" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="344" y="366" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="355" y="366" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="366" y="366" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="377" y="366" width="9" height="9" rx="2" fill="#93afbd"/><rect x="388" y="366" width="9" height="9" rx="2" fill="#93afbd"/><rect x="399" y="366" width="9" height="9" rx="2" fill="#5f879e"/><rect x="333" y="377" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="344" y="377" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="355" y="377" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="366" y="377" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="377" y="377" width="9" height="9" rx="2" fill="#93afbd"/><rect x="388" y="377" width="9" height="9" rx="2" fill="#93afbd"/><rect x="399" y="377" width="9" height="9" rx="2" fill="#5f879e"/><rect x="333" y="388" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="344" y="388" width="9" height="9" rx="2" fill="#e2e9ec"/><rect x="355" y="388" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="366" y="388" width="9" height="9" rx="2" fill="#c2d1d8"/><rect x="377" y="388" width="9" height="9" rx="2" fill="#93afbd"/><rect x="388" y="388" width="9" height="9" rx="2" fill="#93afbd"/><rect x="399" y="388" width="9" height="9" rx="2" fill="#5f879e"/><text x="427" y="382" font-size="17" fill="#5c6b73" font-weight="400" text-anchor="start">Terrain + position channels</text><polyline points="732,135 783,135 783,242 832,242" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="732,337 783,337 783,242" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="832" y="166" width="262" height="154" rx="13" fill="#edf3ef" stroke="#c2cdd4"/><text x="853" y="201" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">156 scene tokens</text><text x="853" y="233" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Shared with both</text><text x="853" y="260" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">motion denoisers</text><text x="560" y="475" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="middle">All geometry is expressed relative to the robot at the start of the window.</text></g></svg>