<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1220" viewBox="0 0 420 1220" role="img" aria-labelledby="title desc">
<title id="title">External obstacle constraints inside IK</title>
<desc id="desc">A depth image captured once is masked, projected into the robot frame, and downsampled into a saved cloud. Collision spheres and nearby cloud points provide clearance constraints. The IK solver combines these with VR end-effector targets and robot limits. A final guard checks the joint command before it is sent to the robot. The accepted command updates the modeled configuration for the next control step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#59666d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="420" height="1220" fill="#fcfcf9"/><g font-family="Arial, Helvetica, sans-serif"><rect x="66" y="16" width="336" height="190" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="84" y="42" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">01</text><text x="234.0" y="71" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Capture depth</text><g transform="translate(234.0 112)" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#497f70" stroke-width="2.5"><rect x="-31" y="-19" width="62" height="34" rx="7"/><circle cx="-15" cy="-2" r="6"/><circle cx="15" cy="-2" r="6"/><path d="M0 15 V26 M-15 26 H15"/></g></g><text x="234.0" y="157" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Depth image · captured once</text><text x="234.0" y="180" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Robot outside camera view</text><path d="M234 206 V241" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="66" y="248" width="336" height="205" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="84" y="274" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">02</text><text x="234.0" y="303" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Prepare cloud</text><g transform="translate(234.0 344)" stroke-linecap="round" stroke-linejoin="round"><circle cx="-32" cy="-16" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="-12" cy="-20" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="9" cy="-16" r="3.5" fill="#497f70" opacity="0.9"/><circle cx="29" cy="-21" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="-27" cy="4" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="-6" cy="0" r="3.5" fill="#497f70" opacity="0.9"/><circle cx="15" cy="5" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="33" cy="0" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="-30" cy="22" r="3.5" fill="#497f70" opacity="0.9"/><circle cx="-10" cy="24" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="11" cy="20" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="30" cy="22" r="3.5" fill="#497f70" opacity="0.9"/></g><text x="234.0" y="389" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Mask → project → transform</text><text x="234.0" y="412" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Downsample + keep in reach</text><text x="234.0" y="435" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Save cloud in robot frame</text><path d="M234 453 V498" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="66" y="505" width="336" height="235" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="84" y="531" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">03</text><text x="234.0" y="560" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Build constraints</text><g transform="translate(234.0 601)" stroke-linecap="round" stroke-linejoin="round"><path d="M-43 23 L-23 -3 L-2 10" fill="none" stroke="#66829b" stroke-width="9"/><g fill="#edf3fa" stroke="#3869a0" stroke-width="2"><circle cx="-43" cy="23" r="10"/><circle cx="-23" cy="-3" r="12"/><circle cx="-2" cy="10" r="11"/></g><path d="M29 -20 V33" fill="none" stroke="#497f70" stroke-width="2" stroke-dasharray="2 7"/><path d="M12 10 H26 M16 6 L12 10 L16 14 M22 6 L26 10 L22 14" fill="none" stroke="#497f70" stroke-width="1.5"/></g><text x="234.0" y="646" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Cloud + robot collision spheres</text><text x="234.0" y="669" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Find nearest obstacle points</text><text x="234.0" y="692" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Measure clearance</text><text x="234.0" y="715" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Limit movement toward obstacles</text><path d="M234 740 V785" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="66" y="792" width="336" height="235" rx="13" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/><text x="84" y="818" text-anchor="start" font-size="13" fill="#3869a0" font-weight="500" font-family="monospace">04</text><text x="234.0" y="847" text-anchor="middle" font-size="21" fill="#3869a0" font-weight="600" >Solve IK</text><g transform="translate(234.0 888)" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#3869a0" stroke-width="2.5"><path d="M-32 -16 H32 M-32 3 H32 M-32 22 H32"/><circle cx="-13" cy="-16" r="5" fill="#edf3fa"/><circle cx="17" cy="3" r="5" fill="#edf3fa"/><circle cx="-3" cy="22" r="5" fill="#edf3fa"/></g></g><text x="234.0" y="933" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Inputs: VR targets + constraints</text><text x="234.0" y="956" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Track end-effector targets</text><text x="234.0" y="979" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Respect obstacle constraints</text><text x="234.0" y="1002" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Joint + self-collision limits</text><path d="M234 1027 V1073" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="66" y="1080" width="336" height="78" rx="13" fill="#f3f4f0" stroke="#c4cdc5" stroke-width="1.5"/><text x="234" y="1110" text-anchor="middle" font-size="18" fill="#24313a" font-weight="600" >Guard → joint command</text><text x="234" y="1136" text-anchor="middle" font-size="15" fill="#59666d" font-weight="400" >Send accepted command to robot</text><path d="M234 1158 V1180 Q234 1192 222 1192 H40 Q28 1192 28 1180 V634 Q28 622 40 622 H59" fill="none" stroke="#8093a4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="14" y="945" text-anchor="middle" font-size="15" fill="#59666d" font-weight="400" transform="rotate(-90 14 945)">Previous accepted command · repeat at 110 Hz</text></g></svg>
