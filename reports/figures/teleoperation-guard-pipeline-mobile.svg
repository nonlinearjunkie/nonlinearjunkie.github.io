<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" role="img" aria-labelledby="title desc">
<title id="title">Post-IK collision guard</title>
<desc id="desc">IK proposes a joint movement from the VR target. With a valid static or live obstacle cloud, the active guard checks modeled sphere positions halfway through the movement and at its endpoint. A proposal with no overlap is sent. A collision holds the affected arm, and any remaining arm motion is rechecked. The accepted command is retained for the next update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#59666d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="420" height="900" fill="#fcfcf9"/><g font-family="Arial, Helvetica, sans-serif"><rect x="66" y="16" width="336" height="205" rx="13" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/><text x="84" y="42" text-anchor="start" font-size="13" fill="#3869a0" font-weight="500" font-family="monospace">01</text><text x="234.0" y="71" text-anchor="middle" font-size="21" fill="#3869a0" font-weight="600" >Propose motion</text><g transform="translate(234.0 112)" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#3869a0" stroke-width="2.5"><path d="M-32 -16 H32 M-32 3 H32 M-32 22 H32"/><circle cx="-13" cy="-16" r="5" fill="#edf3fa"/><circle cx="17" cy="3" r="5" fill="#edf3fa"/><circle cx="-3" cy="22" r="5" fill="#edf3fa"/></g></g><text x="234.0" y="157" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >VR target poses → IK</text><text x="234.0" y="180" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Keep existing robot limits</text><text x="234.0" y="203" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Generate next joint command</text><path d="M234 221 V265" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="66" y="272" width="336" height="250" rx="13" fill="#f3f6f2" stroke="#c8d8ce" stroke-width="1.5"/><text x="84" y="298" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">02</text><text x="234.0" y="327" text-anchor="middle" font-size="21" fill="#497f70" font-weight="600" >Check motion</text><g transform="translate(234.0 364)"><path d="M-57 0 H57" stroke="#91a3b2" stroke-width="2" stroke-dasharray="4 4"/><circle cx="-57" cy="0" r="8" fill="#ffffff" stroke="#3869a0" stroke-width="2"/><text x="-57" y="29" text-anchor="middle" font-size="13" fill="#59666d" font-weight="400" >Start</text><circle cx="0" cy="0" r="8" fill="#edf3fa" stroke="#3869a0" stroke-width="2"/><text x="0" y="29" text-anchor="middle" font-size="13" fill="#59666d" font-weight="400" >50%</text><circle cx="57" cy="0" r="8" fill="#edf3fa" stroke="#3869a0" stroke-width="2"/><text x="57" y="29" text-anchor="middle" font-size="13" fill="#59666d" font-weight="400" >100%</text></g><text x="234.0" y="423" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Use valid cloud + robot spheres</text><text x="234.0" y="446" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Check halfway + endpoint</text><text x="234.0" y="469" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Test sphere–cloud overlap</text><text x="234.0" y="492" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Static or live cloud · CAPT</text><path d="M234 522 V565" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="66" y="572" width="336" height="244" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="84" y="598" text-anchor="start" font-size="13" fill="#3869a0" font-weight="500" font-family="monospace">03</text><text x="234.0" y="627" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Accept or hold</text><rect x="83" y="651" width="302" height="46" rx="8" fill="#edf5ef" stroke="#cadbcd" stroke-width="1.5"/><text x="234.0" y="680" text-anchor="middle" font-size="17" fill="#497f70" font-weight="600" >No hit → send proposal</text><rect x="83" y="711" width="302" height="46" rx="8" fill="#faf1e7" stroke="#e4d4bf" stroke-width="1.5"/><text x="234.0" y="740" text-anchor="middle" font-size="17" fill="#8b633b" font-weight="600" >Hit → hold affected arm</text><text x="234.0" y="786" text-anchor="middle" font-size="15" fill="#59666d" font-weight="400" >Recheck any remaining arm motion</text><path d="M234 816 V846 Q234 858 222 858 H40 Q28 858 28 846 V141 Q28 129 40 129 H59" fill="none" stroke="#8093a4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="14" y="546" text-anchor="middle" font-size="15" fill="#59666d" font-weight="400" transform="rotate(-90 14 546)">Previous accepted command → next starting configuration</text></g></svg>
