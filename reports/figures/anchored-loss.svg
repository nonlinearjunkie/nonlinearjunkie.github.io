<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
  <title id="title">Anchored consequence supervision</title>
  <desc id="desc">Policy actions and recorded actions each pass through the same frozen RoboJEPA using the same observation. Their predicted futures are compared. The reference is fixed and only the policy is updated.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#6c777e" stroke-width="1.3"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#24343d">
    <text x="440" y="29" font-size="15" fill="#63727b">Same current images for both forecasts</text>
    <rect x="225" y="61" width="220" height="228" rx="14" fill="#f0f1ed" stroke="#a8b1ad" stroke-dasharray="5 5"/>
    <text x="335" y="87" font-size="14" font-weight="600">One frozen RoboJEPA</text>
    <rect x="22" y="104" width="168" height="62" rx="9" fill="#e4edf9" stroke="#6f93c2"/>
    <text x="106" y="130" font-size="17" font-weight="600">Policy actions</text><text x="106" y="151" font-size="13" fill="#58779c">First 4 commands</text>
    <rect x="22" y="220" width="168" height="62" rx="9" fill="#f5f1e8" stroke="#b4ab98"/>
    <text x="106" y="246" font-size="17" font-weight="600">Recorded actions</text><text x="106" y="267" font-size="13" fill="#79715f">First 4 commands</text>
    <rect x="251" y="109" width="168" height="52" rx="8" fill="#fff" stroke="#b7c0ba"/>
    <text x="335" y="141" font-size="16">Policy pass</text>
    <rect x="251" y="225" width="168" height="52" rx="8" fill="#fff" stroke="#b7c0ba"/>
    <text x="335" y="257" font-size="16">Reference pass</text>
    <rect x="485" y="104" width="170" height="62" rx="9" fill="#e4edf9" stroke="#6f93c2"/>
    <text x="570" y="130" font-size="17" font-weight="600">Policy future latents</text><text x="570" y="151" font-size="13" fill="#58779c">Predicted by RoboJEPA</text>
    <rect x="485" y="220" width="170" height="62" rx="9" fill="#f5f1e8" stroke="#b4ab98"/>
    <text x="570" y="246" font-size="15" font-weight="600">Reference future latents</text><text x="570" y="267" font-size="13" fill="#79715f">Fixed target</text>
    <rect x="714" y="156" width="146" height="76" rx="10" fill="#e9efe7" stroke="#96a68c"/>
    <text x="787" y="184" font-size="16" font-weight="600">Compare</text><text x="787" y="207" font-size="14">Mean L1 distance</text>
    <text x="440" y="330" font-size="14" fill="#58779c">This loss updates the policy. World-model weights stay fixed.</text>
  </g>
  <g stroke="#6c777e" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M190 135H247"/><path d="M190 251H247"/>
    <path d="M419 135H481"/><path d="M419 251H481"/>
    <path d="M655 135H682V178H710"/><path d="M655 251H682V211H710"/>
  </g>
</svg>
