<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="title desc">
<title id="title">Post-IK collision guard</title>
<desc id="desc">IK proposes a joint movement from the VR target. With a valid static or live obstacle cloud, the active guard checks modeled sphere positions halfway through the movement and at its endpoint. A proposal with no overlap is sent. A collision holds the affected arm, and any remaining arm motion is rechecked. The accepted command is retained for the next update.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#59666d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1120" height="562" fill="#fcfcf9"/><g font-family="Arial, Helvetica, sans-serif"><rect x="18" y="24" width="312" height="89" rx="13" fill="#f1f5fb" stroke="#c5d3e4" stroke-width="1.5"/><text x="174" y="58" text-anchor="middle" font-size="21" fill="#3869a0" font-weight="600" >VR controllers</text><text x="174" y="84" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >End-effector target poses</text><path d="M174 113 V167" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="404" y="24" width="312" height="100" rx="13" fill="#f2f6f2" stroke="#c8d8ce" stroke-width="1.5"/><text x="560" y="54" text-anchor="middle" font-size="21" fill="#497f70" font-weight="600" >Obstacle data</text><text x="560" y="81" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Valid static / live cloud · CAPT</text><text x="560" y="107" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Robot collision spheres</text><path d="M560 124 V167" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="18" y="174" width="312" height="235" rx="13" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/><text x="36" y="200" text-anchor="start" font-size="13" fill="#3869a0" font-weight="500" font-family="monospace">01</text><text x="174.0" y="229" text-anchor="middle" font-size="21" fill="#3869a0" font-weight="600" >Propose motion</text><g transform="translate(174.0 270)" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#3869a0" stroke-width="2.5"><path d="M-32 -16 H32 M-32 3 H32 M-32 22 H32"/><circle cx="-13" cy="-16" r="5" fill="#edf3fa"/><circle cx="17" cy="3" r="5" fill="#edf3fa"/><circle cx="-3" cy="22" r="5" fill="#edf3fa"/></g></g><text x="174.0" y="315" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >IK tracks the operator’s targets</text><text x="174.0" y="338" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Keep existing robot limits</text><text x="174.0" y="361" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Generate next joint command</text><rect x="404" y="174" width="312" height="235" rx="13" fill="#f3f6f2" stroke="#c8d8ce" stroke-width="1.5"/><text x="422" y="200" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">02</text><text x="560.0" y="229" text-anchor="middle" font-size="21" fill="#497f70" font-weight="600" >Check motion</text><g transform="translate(560.0 266)"><path d="M-57 0 H57" stroke="#91a3b2" stroke-width="2" stroke-dasharray="4 4"/><circle cx="-57" cy="0" r="8" fill="#ffffff" stroke="#3869a0" stroke-width="2"/><text x="-57" y="29" text-anchor="middle" font-size="13" fill="#59666d" font-weight="400" >Start</text><circle cx="0" cy="0" r="8" fill="#edf3fa" stroke="#3869a0" stroke-width="2"/><text x="0" y="29" text-anchor="middle" font-size="13" fill="#59666d" font-weight="400" >50%</text><circle cx="57" cy="0" r="8" fill="#edf3fa" stroke="#3869a0" stroke-width="2"/><text x="57" y="29" text-anchor="middle" font-size="13" fill="#59666d" font-weight="400" >100%</text></g><text x="560.0" y="325" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Check halfway + endpoint</text><text x="560.0" y="348" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Test sphere–cloud overlap</text><text x="560.0" y="371" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Identify the affected arm(s)</text><rect x="790" y="174" width="312" height="235" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="808" y="200" text-anchor="start" font-size="13" fill="#3869a0" font-weight="500" font-family="monospace">03</text><text x="946.0" y="229" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Accept or hold</text><rect x="807" y="253" width="278" height="46" rx="8" fill="#edf5ef" stroke="#cadbcd" stroke-width="1.5"/><text x="946.0" y="282" text-anchor="middle" font-size="17" fill="#497f70" font-weight="600" >No hit → send proposal</text><rect x="807" y="313" width="278" height="46" rx="8" fill="#faf1e7" stroke="#e4d4bf" stroke-width="1.5"/><text x="946.0" y="342" text-anchor="middle" font-size="17" fill="#8b633b" font-weight="600" >Hit → hold affected arm</text><text x="946.0" y="388" text-anchor="middle" font-size="15" fill="#59666d" font-weight="400" >Recheck any remaining arm motion</text><path d="M330 277 H397" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="368" y="253" text-anchor="middle" font-size="14" fill="#59666d" font-weight="400" >Proposal</text><path d="M716 277 H783" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="753" y="253" text-anchor="middle" font-size="14" fill="#59666d" font-weight="400" >Result</text><path d="M946 409 V487 Q946 499 934 499 H186 Q174 499 174 487 V416" fill="none" stroke="#8093a4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="560" y="533" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Previous accepted command → starting configuration for the next IK update</text></g></svg>
