<svg xmlns="http://www.w3.org/2000/svg" width="480" height="850" viewBox="0 0 480 850" role="img" aria-labelledby="title desc">
<title id="title">Scene conditioning in both denoisers</title><desc id="desc">Each stage receives the same scene conditioning, and DDIM iterates their combined prediction.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#91a3af" stroke-width="1.2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="30" font-size="15" fill="#355f86" font-weight="600" text-anchor="start">ONE DENOISING STEP</text><rect x="24" y="53" width="432" height="128" rx="13" fill="#edf3ef" stroke="#c2cdd4"/><text x="45" y="88" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Shared conditioning</text><text x="45" y="120" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">156 scene tokens</text><text x="45" y="147" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Text + time + initial heading</text><polyline points="240,181 240,220" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="456,120 468,120 468,485 456,485" fill="none" stroke="#355f86" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="228" width="432" height="136" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="45" y="263" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Root denoiser</text><text x="45" y="295" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Input: complete noisy motion</text><text x="45" y="322" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Output: position + heading (5)</text><polyline points="240,364 240,413" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="392" font-size="16" fill="#5c6b73" font-weight="400" text-anchor="middle">Convert to local root · detach in training</text><rect x="24" y="421" width="432" height="142" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="45" y="456" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Body denoiser</text><text x="45" y="488" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Local root + noisy body features</text><text x="45" y="515" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Output: body features (412)</text><polyline points="240,563 240,641" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="648" width="432" height="127" rx="13" fill="#edf3ef" stroke="#c2cdd4"/><text x="45" y="683" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Clean-motion prediction</text><text x="45" y="715" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Concatenate root + body</text><text x="240" y="815" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="middle">DDIM update → refine motion → repeat</text></g></svg>