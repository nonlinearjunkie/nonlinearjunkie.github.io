<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="562" viewBox="0 0 1120 562" role="img" aria-labelledby="title desc">
<title id="title">External obstacle constraints inside IK</title>
<desc id="desc">A depth image captured once is masked, projected into the robot frame, and downsampled into a saved cloud. Collision spheres and nearby cloud points provide clearance constraints. The IK solver combines these with VR end-effector targets and robot limits. A final guard checks the joint command before it is sent to the robot. The accepted command updates the modeled configuration for the next control step.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#59666d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1120" height="562" fill="#fcfcf9"/><g font-family="Arial, Helvetica, sans-serif"><text x="143" y="146" text-anchor="middle" font-size="13" fill="#497f70" font-weight="500" letter-spacing="1.5">CAPTURE ONCE</text><rect x="18" y="174" width="250" height="205" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="36" y="200" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">01</text><text x="143.0" y="229" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Capture depth</text><g transform="translate(143.0 270)" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#497f70" stroke-width="2.5"><rect x="-31" y="-19" width="62" height="34" rx="7"/><circle cx="-15" cy="-2" r="6"/><circle cx="15" cy="-2" r="6"/><path d="M0 15 V26 M-15 26 H15"/></g></g><text x="143.0" y="315" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Depth image of workspace</text><text x="143.0" y="338" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Robot outside camera view</text><rect x="296" y="174" width="250" height="205" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="314" y="200" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">02</text><text x="421.0" y="229" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Prepare cloud</text><g transform="translate(421.0 270)" stroke-linecap="round" stroke-linejoin="round"><circle cx="-32" cy="-16" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="-12" cy="-20" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="9" cy="-16" r="3.5" fill="#497f70" opacity="0.9"/><circle cx="29" cy="-21" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="-27" cy="4" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="-6" cy="0" r="3.5" fill="#497f70" opacity="0.9"/><circle cx="15" cy="5" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="33" cy="0" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="-30" cy="22" r="3.5" fill="#497f70" opacity="0.9"/><circle cx="-10" cy="24" r="3.5" fill="#497f70" opacity="0.5"/><circle cx="11" cy="20" r="3.5" fill="#497f70" opacity="0.7"/><circle cx="30" cy="22" r="3.5" fill="#497f70" opacity="0.9"/></g><text x="421.0" y="315" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Mask → project → transform</text><text x="421.0" y="338" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Downsample + keep in reach</text><text x="421.0" y="361" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Save cloud in robot frame</text><rect x="574" y="174" width="250" height="205" rx="13" fill="#ffffff" stroke="#d7ddda" stroke-width="1.5"/><text x="592" y="200" text-anchor="start" font-size="13" fill="#497f70" font-weight="500" font-family="monospace">03</text><text x="699.0" y="229" text-anchor="middle" font-size="21" fill="#24313a" font-weight="600" >Build constraints</text><g transform="translate(699.0 270)" stroke-linecap="round" stroke-linejoin="round"><path d="M-43 23 L-23 -3 L-2 10" fill="none" stroke="#66829b" stroke-width="9"/><g fill="#edf3fa" stroke="#3869a0" stroke-width="2"><circle cx="-43" cy="23" r="10"/><circle cx="-23" cy="-3" r="12"/><circle cx="-2" cy="10" r="11"/></g><path d="M29 -20 V33" fill="none" stroke="#497f70" stroke-width="2" stroke-dasharray="2 7"/><path d="M12 10 H26 M16 6 L12 10 L16 14 M22 6 L26 10 L22 14" fill="none" stroke="#497f70" stroke-width="1.5"/></g><text x="699.0" y="315" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Find nearest obstacle points</text><text x="699.0" y="338" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Measure sphere clearance</text><text x="699.0" y="361" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Limit movement toward them</text><rect x="852" y="174" width="250" height="205" rx="13" fill="#edf3fa" stroke="#b6c9df" stroke-width="1.5"/><text x="870" y="200" text-anchor="start" font-size="13" fill="#3869a0" font-weight="500" font-family="monospace">04</text><text x="977.0" y="229" text-anchor="middle" font-size="21" fill="#3869a0" font-weight="600" >Solve IK</text><g transform="translate(977.0 270)" stroke-linecap="round" stroke-linejoin="round"><g fill="none" stroke="#3869a0" stroke-width="2.5"><path d="M-32 -16 H32 M-32 3 H32 M-32 22 H32"/><circle cx="-13" cy="-16" r="5" fill="#edf3fa"/><circle cx="17" cy="3" r="5" fill="#edf3fa"/><circle cx="-3" cy="22" r="5" fill="#edf3fa"/></g></g><text x="977.0" y="315" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Track end-effector targets</text><text x="977.0" y="338" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Respect obstacle constraints</text><text x="977.0" y="361" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Joint + self-collision limits</text><path d="M268 277 H290" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M546 277 H568" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M824 277 H846" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="574" y="24" width="250" height="89" rx="13" fill="#f2f6f2" stroke="#c8d8ce" stroke-width="1.5"/><text x="699" y="58" text-anchor="middle" font-size="20" fill="#497f70" font-weight="600" >Robot mesh</text><text x="699" y="84" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Represented by collision spheres</text><path d="M699 113 V167" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="852" y="24" width="250" height="89" rx="13" fill="#f1f5fb" stroke="#c5d3e4" stroke-width="1.5"/><text x="977" y="58" text-anchor="middle" font-size="20" fill="#3869a0" font-weight="600" >VR controllers</text><text x="977" y="84" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >End-effector target poses</text><path d="M977 113 V167" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M977 379 V413" fill="none" stroke="#59666d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="852" y="420" width="250" height="78" rx="13" fill="#f3f4f0" stroke="#c4cdc5" stroke-width="1.5"/><text x="977" y="450" text-anchor="middle" font-size="18" fill="#24313a" font-weight="600" >Guard → joint command</text><text x="977" y="476" text-anchor="middle" font-size="15" fill="#59666d" font-weight="400" >Send accepted command to robot</text><path d="M977 498 V514 Q977 526 965 526 H711 Q699 526 699 514 V386" fill="none" stroke="#8093a4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="832" y="551" text-anchor="middle" font-size="16" fill="#59666d" font-weight="400" >Previous accepted command · repeat at 110 Hz</text></g></svg>
