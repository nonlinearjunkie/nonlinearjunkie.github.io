<svg xmlns="http://www.w3.org/2000/svg" width="480" height="810" viewBox="0 0 480 810" role="img" aria-labelledby="title desc">
<title id="title">Local motion windows form a complete course</title><desc id="desc">Five generated frames connect adjacent windows. The output is kinematic motion, separate from tracking.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#91a3af" stroke-width="1.2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="30" font-size="15" fill="#355f86" font-weight="600" text-anchor="start">CHAIN LOCAL MOTION WINDOWS</text><rect x="24" y="54" width="432" height="129" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="45" y="89" font-size="21" fill="#20303b" font-weight="600" text-anchor="start">Generate the first window</text><text x="45" y="121" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Initial scene query</text><text x="45" y="148" font-size="19" fill="#5c6b73" font-weight="400" text-anchor="start">Up to 300 frames at 30 Hz</text><polyline points="240,183 240,221" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="229" width="432" height="145" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="45" y="264" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Prepare the next window</text><text x="45" y="296" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Retain the last 5 generated frames</text><text x="45" y="323" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Query the same static map</text><text x="45" y="350" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">at the overlap-start pose</text><rect x="350" y="350" width="12" height="10" rx="2" fill="#8e85a8" opacity="0.75"/><rect x="366" y="350" width="12" height="10" rx="2" fill="#8e85a8" opacity="0.75"/><rect x="382" y="350" width="12" height="10" rx="2" fill="#8e85a8" opacity="0.75"/><rect x="398" y="350" width="12" height="10" rx="2" fill="#8e85a8" opacity="0.75"/><rect x="414" y="350" width="12" height="10" rx="2" fill="#8e85a8" opacity="0.75"/><polyline points="240,374 240,411" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="419" width="432" height="128" rx="13" fill="#edf3ef" stroke="#c2cdd4"/><text x="45" y="454" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Generate with overlap constraints</text><text x="45" y="486" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Blend overlap; append new suffix</text><text x="240" y="583" font-size="17" fill="#5c6b73" font-weight="400" text-anchor="middle">Repeat until the requested duration is reached.</text><polyline points="240,596 240,632" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="640" width="432" height="144" rx="13" fill="#f2f0e9" stroke="#c2cdd4"/><text x="45" y="675" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Restore and export</text><text x="45" y="707" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Add terrain height + scene placement</text><text x="45" y="734" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">G1 root pose + 29 joint angles</text></g></svg>