<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Scene conditioning in the two-stage denoiser</title><desc id="desc">Root and body predictions share scene conditioning. DDIM uses their combined output to refine the motion.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#91a3af" stroke-width="1.2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><text x="26" y="30" font-size="15" fill="#355f86" font-weight="600" text-anchor="start">ONE DENOISING STEP</text><rect x="259" y="54" width="612" height="82" rx="13" fill="#edf3ef" stroke="#c2cdd4"/><text x="280" y="89" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Shared conditioning: scene + text + time + heading</text><polyline points="412,136 412,190" fill="none" stroke="#355f86" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="748,136 748,190" fill="none" stroke="#355f86" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="26" y="196" width="228" height="125" rx="13" fill="#f2f0e9" stroke="#c2cdd4"/><text x="47" y="231" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Noisy motion</text><text x="47" y="263" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Root + body features</text><polyline points="254,232 293,232" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="293" y="190" width="237" height="142" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="314" y="225" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Root denoiser</text><text x="314" y="257" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Position + heading</text><text x="314" y="284" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">5 predicted features</text><polyline points="530,258 616,258" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="573" y="217" font-size="16" fill="#5c6b73" font-weight="400" text-anchor="middle">Local root</text><text x="573" y="300" font-size="14" fill="#5c6b73" font-weight="400" text-anchor="middle">Detach in</text><text x="573" y="320" font-size="14" fill="#5c6b73" font-weight="400" text-anchor="middle">training</text><rect x="616" y="190" width="263" height="142" rx="13" fill="#edf2f6" stroke="#c2cdd4"/><text x="637" y="225" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Body denoiser</text><text x="637" y="257" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Local root + noisy body</text><text x="637" y="284" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">412 predicted features</text><polyline points="140,321 140,369 747,369 747,332" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="363" y="361" font-size="16" fill="#5c6b73" font-weight="400" text-anchor="start">Noisy body features</text><polyline points="879,258 912,258" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="912" y="190" width="183" height="142" rx="13" fill="#edf3ef" stroke="#c2cdd4"/><text x="933" y="225" font-size="20" fill="#20303b" font-weight="600" text-anchor="start">Clean motion</text><text x="933" y="257" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="start">Root + body</text><polyline points="1003,332 1003,427 140,427 140,321" fill="none" stroke="#91a3af" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="562" y="417" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="middle">DDIM update → next noisy motion → repeat</text><text x="560" y="489" font-size="18" fill="#5c6b73" font-weight="400" text-anchor="middle">The route comes from the root network; no separate planner supplies it.</text></g></svg>